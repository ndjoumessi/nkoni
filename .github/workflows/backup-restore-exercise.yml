name: Backup & Restore Exercise (§0.2 GA Blocker)

on:
  # Déclenchement manuel depuis GitHub Actions
  workflow_dispatch:
  # Calendrier : chaque dimanche à 03:00 UTC (fuseau applicatif Cameroun = UTC+2, donc 05:00 matin local)
  schedule:
    - cron: '0 3 * * 0'

jobs:
  backup-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE_BACKUP }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install PostgreSQL client tools
        run: |
          # Dépôt PGDG : le postgresql-client par défaut d'Ubuntu (16.x) est trop ancien pour
          # dumper le serveur Railway (18.x) — pg_dump refuse un serveur d'une majeure supérieure.
          # Épinglé sur -18 = la majeure du serveur ; à relever si Railway passe à 19 (le run
          # hebdomadaire échouera alors visiblement, servant de canari).
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          # /usr/bin/pg_dump est pg_wrapper (postgresql-common), qui résout vers la version par
          # DÉFAUT du runner (16) même une fois la 18 installée. On met le répertoire versionné en
          # tête de PATH pour toutes les étapes suivantes (le dump est dans une autre étape).
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Verify PostgreSQL connection
        run: |
          echo "Testing connection to production database..."
          psql "$DATABASE_URL" -c "SELECT version();" 2>&1

      - name: §2.1 — Dump production database
        run: |
          mkdir -p ~/Sauvegardes/nkoni
          export STAMP="$(date +%Y%m%d_%H%M%S)"
          export BACKUP_FILE=~/Sauvegardes/nkoni/nkoni_${STAMP}.dump
          
          echo "Dumping PostgreSQL database..."
          pg_dump "$DATABASE_URL" -Fc --no-owner --no-privileges > "$BACKUP_FILE"
          
          SIZE=$(ls -lh "$BACKUP_FILE" | awk '{print $5}')
          echo "✅ Backup complete: $(basename $BACKUP_FILE) ($SIZE)"
          
          echo "STAMP=$STAMP" >> $GITHUB_ENV
          echo "BACKUP_FILE=$BACKUP_FILE" >> $GITHUB_ENV

      - name: §2.2 — Encrypt dump with GPG
        run: |
          echo "Encrypting with AES256..."
          echo "$GPG_PASSPHRASE" | gpg --symmetric --cipher-algo AES256 --batch --passphrase-fd 0 "$BACKUP_FILE"
          
          BACKUP_GPG="${BACKUP_FILE}.gpg"
          rm "$BACKUP_FILE"
          
          SIZE=$(ls -lh "$BACKUP_GPG" | awk '{print $5}')
          echo "✅ Encrypted: $(basename $BACKUP_GPG) ($SIZE)"
          echo "BACKUP_GPG=$BACKUP_GPG" >> $GITHUB_ENV

      - name: §2.2 — Verify dump is readable
        run: |
          set -o pipefail
          echo "Verifying GPG-encrypted dump..."
          # AUCUN tuyau entre gpg et pg_restore. `pg_restore --list` ne lit que la table des matières
          # en tête d'archive puis SORT : il ferme le tuyau, gpg meurt en « broken pipe » (code 2) et
          # — sous pipefail — fait échouer l'étape alors que le dump est parfaitement valide. C'est
          # ce que masquait l'ancien `… | head` : sans pipefail il sortait 0 quoi qu'il arrive, donc
          # la garde ne pouvait NI détecter un dump corrompu, NI signaler ce faux négatif.
          # On déchiffre vers un fichier, puis on liste le fichier : le code de sortie de pg_restore
          # devient enfin significatif. stderr non supprimé — une garde muette ne se diagnostique pas.
          CLAIR="$(mktemp)"
          trap 'rm -f "$CLAIR"' EXIT
          echo "$GPG_PASSPHRASE" | gpg --batch --passphrase-fd 0 --decrypt "$BACKUP_GPG" > "$CLAIR"
          # LA vérification, c'est CETTE affectation : pg_restore lit l'archive ENTIÈRE et son code
          # de sortie est significatif (aucun tuyau pour le tronquer).
          LISTING="$(pg_restore --list "$CLAIR")"
          NB_ENTREES="$(printf '%s\n' "$LISTING" | grep -c '^[0-9]' || true)"
          # AFFICHAGE seulement, `|| true` assumé : `head` ferme le tuyau après 5 lignes et
          # provoquerait un broken pipe en amont — sous pipefail, l'affichage ferait alors échouer
          # l'étape alors que le dump est valide. Piège déjà rencontré deux fois ici (gpg→pg_restore,
          # puis pg_restore→head) : ne JAMAIS laisser le cosmétique décider du verdict.
          printf '%s\n' "$LISTING" | head -5 || true
          echo "  entrées dans l'archive : $NB_ENTREES"
          if [ "$NB_ENTREES" -eq 0 ]; then
            echo "::error::Archive lisible mais VIDE (0 entrée) — sauvegarde inexploitable."
            exit 1
          fi
          echo "✓ Dump is readable and restorable"

      - name: Upload encrypted backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nkoni-backup-${{ env.STAMP }}
          path: ${{ env.BACKUP_GPG }}
          retention-days: 30
          compression-level: 0  # Already compressed by pg_dump -Fc

      - name: Report backup completion
        run: |
          echo "## ✅ Backup Exercise Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | ${{ env.STAMP }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backup file | $(basename ${{ env.BACKUP_GPG }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| Size | $(ls -lh ${{ env.BACKUP_GPG }} | awk '{print $5}') |" >> $GITHUB_STEP_SUMMARY
          echo "| Encryption | AES256-GPG ✓ |" >> $GITHUB_STEP_SUMMARY
          echo "| Readability | ✓ Verified |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next steps (§4 of RUNBOOK):** Download the artifact and run the restore exercise locally." >> $GITHUB_STEP_SUMMARY

  # Optionnel : notification sur Slack ou email en cas d'échec
  notify-on-failure:
    runs-on: ubuntu-latest
    needs: backup-and-verify
    if: failure()
    # Droit d'écrire une issue avec le GITHUB_TOKEN du run (token en lecture seule par défaut).
    permissions:
      issues: write
    steps:
      - name: Ouvrir ou mettre à jour une issue d'échec
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OBLIGATOIRE : ce job n'a pas d'étape `checkout`, donc le runner n'est pas dans un dépôt
          # git et `gh` ne peut inférer le dépôt cible (« not a git repository »). Sans cette
          # variable, les trois commandes gh ci-dessous échouent et AUCUNE issue n'est créée —
          # l'alerte annoncée n'existerait pas.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Une alerte VISIBLE : l'ancien job ne faisait qu'echo + exit 1, donc un échec du dimanche
          # 03:00 restait invisible sauf à ouvrir l'onglet Actions — exactement le risque §0
          # (dispositif qu'on croit actif et qui échoue en silence). On ouvre une issue GitHub, sans
          # secret externe. Dédup : on commente l'issue ouverte existante plutôt que d'en créer une
          # à chaque échec.
          TITRE="⚠️ Échec de l'exercice de sauvegarde (§0.2 GA)"
          CORPS=$(printf 'Le workflow **backup-restore-exercise** a échoué le %s.\n\nRun : %s\n\nAucune sauvegarde produite pour ce créneau. Consulter les logs, corriger, puis relancer :\n```\ngh workflow run backup-restore-exercise.yml\n```' "$(date -u '+%Y-%m-%d %H:%M UTC')" "$RUN_URL")
          # Label idempotent (créé/à jour ; `create issue --label` échoue si le label n'existe pas).
          gh label create backup-failure --color B60205 --description "Échec du workflow de sauvegarde" --force >/dev/null 2>&1 || true
          EXISTANTE=$(gh issue list --state open --label backup-failure --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTANTE" ]; then
            gh issue comment "$EXISTANTE" --body "$CORPS"
          else
            gh issue create --title "$TITRE" --body "$CORPS" --label backup-failure
          fi
